name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1'  # 每周一 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {}     # 支持手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，找 last_article.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser edge-tts openai ffmpeg-python

      - name: Check new articles
        id: check
        run: |
          # check_articles.py writes has_new=true/false to GITHUB_OUTPUT
          python scripts/check_articles.py
          # GITHUB_OUTPUT is consumed by steps.check.outputs.has_new

      - name: Generate podcast
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: qwen-plus
        run: python scripts/generate_podcast.py --auto

      - name: Update RSS
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_rss.py

      - name: Upload to GitHub Releases
        if: steps.check.outputs.has_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: episodes/*.mp3
          tag_name: episode-${{ github.run_number }}
          name: Episode ${{ github.run_number }}
          body: osp.io 自动生成播客
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
