name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1,3,5'  # 周一/三/五 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {}     # 支持手动触发
  push:
    branches: [main]        # push 到 main 时自动触发

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        run: |
          git clone --depth=1 --single-branch https://github.com/marsdream/osp-podcast.git .
          git fetch origin main
          git checkout main
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser edge-tts openai ffmpeg-python requests

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Generate podcast
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat
        run: python scripts/generate_podcast.py --auto --base-url https://api.deepseek.com/v1 --model deepseek-chat

      - name: Update RSS
        run: python scripts/update_rss.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp index.html docs/
          # 用 nullglob 避免 *.mp3 字面量参与拷贝
          shopt -s nullglob
          mp3_files=(episodes/*.mp3)
          json_files=(episodes/*.json)
          if [ ${#mp3_files[@]} -gt 0 ]; then
            cp "${mp3_files[@]}" docs/episodes/
          fi
          if [ ${#json_files[@]} -gt 0 ]; then
            cp "${json_files[@]}" docs/episodes/
          fi
          echo "Prepared $(ls docs/episodes/ | wc -l) episode files"

      - name: Verify audio files before deploy
        if: steps.check.outputs.has_new == 'true'
        run: |
          # 如果有 new 文章但没有音频文件，说明 generate_podcast.py 失败了但没报非零退出码
          mp3_count=$(ls episodes/*.mp3 2>/dev/null | wc -l)
          if [ "$mp3_count" -eq 0 ]; then
            echo "ERROR: has_new=true 但 episodes/ 目录没有任何 .mp3 文件，生成可能已失败"
            echo "检查 episodes/ 内容:"
            ls -la episodes/ 2>/dev/null || echo "(目录为空或不存在)"
            exit 1
          fi
          echo "Verified $mp3_count audio files exist"

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages  # CF Pages GitHub Integration 监控 gh-pages 作为 Production
          force_orphan: true        # gh-pages 每次只保留 docs/ 最新内容，不累积旧文件
