name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1,3,5' # 周一/三/五 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {} # 支持手动触发

# 串行队列：同时间只跑一个，trigger 的新 run 排在后面等
concurrency:
  group: osp-podcast-generate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg rsync
          pip install feedparser edge-tts openai ffmpeg-python

      # ── 关键修复 1：从 gh-pages 拿历史音频，确保下次 CI 也能读到 ──
      - name: Fetch historical episodes from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          mkdir -p episodes
          cp gh-pages/episodes/*.mp3 episodes/ 2>/dev/null || true
          cp gh-pages/episodes/*.json episodes/ 2>/dev/null || true

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Commit queue to git
        if: steps.check.outputs.has_new == 'true'
        run: |
          git add -f last_article.json
          git commit -m "chore: article queue for podcast generation" || true
          git push origin main || true

      - name: Process queue (generate podcasts)
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: deepseek-v4-flash
        run: python scripts/generate_podcast.py --auto --model deepseek-v4-flash --base-url "$LLM_BASE_URL"

      - name: Update RSS
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_rss.py

      - name: Generate index.html
        run: python scripts/generate_index.py

      # ── 关键修复 2：新生成的 mp3 写回 main 分支，下次 CI 才能拿到 ──
      - name: Commit new episodes to main
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/*.mp3 episodes/*.json
          git diff --cached --quiet || git commit -m "chore: add new podcast episodes $(date +%Y-%m-%d)"
          git push

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp index.html docs/
          # Local episodes/ has main branch episodes + newly generated ones.
          # Copy to docs/episodes/ for deployment (Cloudflare Pages reads main/docs/).
          rsync -a episodes/ docs/episodes/
          # In docs/ only keep episode_*.json (not legacy osp-podcast-*.json)
          rsync -a --include='episode_*.json' --exclude='osp-podcast-*.json' --exclude='*' episodes/ docs/

      - name: Update main branch with generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.xml
          git commit -m "chore: update index.html and feed.xml" || true
          git push origin main || true

      - name: Verify audio files before deploy
        run: |
          echo "Checking audio files in docs/episodes/"
          COUNT=$(ls docs/episodes/*.mp3 2>/dev/null | wc -l)
          echo "Found $COUNT mp3 files"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No audio files found — preserving existing gh-pages content"
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      - name: Update queue & trigger next run
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_queue.py