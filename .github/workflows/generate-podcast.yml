name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1,3,5' # 周一/三/五 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {} # 支持手动触发

# 串行队列：同时间只跑一个，trigger 的新 run 排在后面等
concurrency:
  group: osp-podcast-generate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # F1：从 gh-pages 拿回完整历史音频。
      # CI runner 是干净虚拟机，main 上的 episodes/ 可能落后于 gh-pages；
      # 不补齐的话，rsync 到 docs/episodes/ 的内容不完整，
      # peaceiris 覆盖式部署会把 gh-pages 上已有的历史音频删掉。
      - name: Fetch historical episodes from gh-pages
        run: |
          set -e
          # actions-gh-pages 会 force-push gh-pages，普通 fetch 会 non-fast-forward 失败，
          # 用 + 强制更新。fetch-depth:0 已经把分支拉下来了，这里只是兜底。
          git fetch --no-tags origin '+gh-pages:gh-pages' || \
          git fetch --no-tags origin '+gh-pages:refs/remotes/origin/gh-pages' || true
          REF=gh-pages
          git rev-parse --verify "$REF" >/dev/null 2>&1 || REF=origin/gh-pages
          git rev-parse --verify "$REF" >/dev/null 2>&1 || { echo "WARN: gh-pages ref unavailable, skip restore"; exit 0; }
          rm -rf /tmp/ghp && mkdir -p /tmp/ghp
          git archive "$REF" episodes | tar -x -C /tmp/ghp
          mkdir -p episodes
          # -n 不覆盖本地已有文件
          cp -n /tmp/ghp/episodes/*.mp3 episodes/ 2>/dev/null || true
          cp -n /tmp/ghp/episodes/*.json episodes/ 2>/dev/null || true
          echo "episodes/ now has $(ls episodes/*.mp3 2>/dev/null | wc -l | tr -d ' ') mp3 and $(ls episodes/*.json 2>/dev/null | wc -l | tr -d ' ') json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg rsync
          pip install feedparser edge-tts openai ffmpeg-python

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Commit queue to git
        if: steps.check.outputs.has_new == 'true'
        run: |
          git add -f last_article.json
          git commit -m "chore: article queue for podcast generation" || true
          git push origin main || true

      - name: Process queue (generate podcasts)
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: glm-5.2
          # OmniRoute 兜底：跨供应商，SenseNova 额度池耗尽时接管。
          # 走 agnes/agnes-2.5-flash，实测真实播客 prompt 200 / 17 段对话。
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: https://omni.herebuy.us/v1
        # generate_podcast.py 内置跨供应商模型级 fallback：
        #   sensenova/glm-5.2
        #   -> sensenova/sensenova-6.8-flash-lite
        #   -> omniroute/agnes/agnes-2.5-flash
        # 限流/超时/5xx 时自动切换，任一成功即可继续。
        # 退避 25 秒等 RPM/TPM 滑窗恢复（3 秒必然全部 429）。
        # 单篇文章失败会 exit 0 跳过，且**不会出队**：
        # generate_podcast.py 写 episode_result.json 标记失败，
        # update_queue.py 只在标记成功时才出队，失败留给下一轮重试。
        run: python scripts/generate_podcast.py --auto --model glm-5.2 --base-url "$LLM_BASE_URL"

      # F2（核心）：新生成的 mp3/json 必须提交回 main。
      # 缺这一步，下一轮 CI 从 main checkout 时拿不到它们，
      # rsync 到 docs/episodes/ 时缺失，peaceiris 覆盖式部署就会把
      # 上一轮已上线的音频删掉 —— 表现为 feed 停在旧日期、音频 404。
      - name: Commit new episodes to main
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f episodes/*.mp3 episodes/episode_*.json
          if git diff --cached --quiet; then
            echo "No new episode files to commit"
          else
            git commit -m "chore: add new podcast episodes $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Update RSS
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_rss.py

      - name: Generate index.html
        run: python scripts/generate_index.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp index.html docs/
          # Local episodes/ has main branch episodes + newly generated ones.
          # Copy to docs/episodes/ for deployment (Cloudflare Pages reads main/docs/).
          rsync -a episodes/ docs/episodes/
          # In docs/ only keep episode_*.json (not legacy osp-podcast-*.json)
          rsync -a --include='episode_*.json' --exclude='osp-podcast-*.json' --exclude='*' episodes/ docs/

      - name: Update main branch with generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.xml
          git commit -m "chore: update index.html and feed.xml" || true
          git push origin main || true

      # F3：真校验音频。之前只数文件个数 —— HTML 404 页面也算通过，
      # 于是坏内容照样部署（线上返回 200 但 content-type: text/html）。
      # 校验失败就 exit 1，让 Deploy 步骤因 success() 条件被跳过，
      # gh-pages 现有内容保持不变。
      - name: Verify audio files before deploy
        run: |
          echo "Checking audio files in docs/episodes/"
          COUNT=$(ls docs/episodes/*.mp3 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $COUNT mp3 files"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No audio files found — aborting deploy to preserve existing gh-pages content"
            exit 1
          fi
          BAD=0
          # 已知的历史遗留坏文件：这些不是本轮生成的，而是 2026-04 手工做的
          # demo 残留 —— osp-podcast-demo-20260401.mp3 实际存的是某个网站的下架
          # 提示页 HTML（head=3c21646f = "<!do"），不是音频。
          # 同一篇文章的真实音频（osp-podcast-20260401_OBra新作...mp3, 7.2MB）
          # 一直都在仓库和线上，feed.xml 里的这条 demo 条目也已发布多年。
          # 所以这里【跳过校验】而不是删文件：删了老订阅者拉这一期会 404。
          # 只对 demo 文件放行；其余任何非音频文件照旧 abort。
          SKIP_LEGACY="osp-podcast-demo-20260401.mp3"
          for f in docs/episodes/*.mp3; do
            [ -e "$f" ] || continue
            # 用 wc -c 而不是 stat -c%s：后者是 GNU coreutils 专有，
            # macOS/BSD 的 stat 会报 "illegal option -- c" 并返回空值，
            # 换 runner 或基础镜像时校验会静默失效。
            SZ=$(wc -c < "$f" | tr -d ' ')
            HEAD=$(head -c 4 "$f" | xxd -p)
            case "$HEAD" in
              494433*|fffb*|fff3*|fff2*|fff1*) : ;;   # ID3 标签 / MPEG 帧同步
              *)
                case "$(basename "$f")" in
                  $SKIP_LEGACY)
                    echo "SKIP (known legacy non-audio, kept for old subscribers): $f (size=$SZ head=$HEAD)"
                    continue ;;
                esac
                echo "INVALID (not audio): $f (size=$SZ head=$HEAD)"; BAD=$((BAD+1)); continue ;;
            esac
            if [ "$SZ" -lt 50000 ]; then
              echo "SUSPICIOUS (too small): $f (size=$SZ)"; BAD=$((BAD+1))
            fi
          done
          if [ "$BAD" -gt 0 ]; then
            echo "ERROR: $BAD invalid audio file(s) found — aborting deploy"
            exit 1
          fi
          echo "All $COUNT mp3 files verified as real audio"

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # F4：keep_files 默认 false = 纯净覆盖式部署，publish_dir 里
          # 没有的文件会被删除（这正是每轮 CI 回滚上一轮音频的原因）。
          # 播客归档只应增不减，显式设为 true。
          keep_files: true

      - name: Update queue & trigger next run
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_queue.py