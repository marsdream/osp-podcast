name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1'  # 每周一 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，找 last_article.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser edge-tts openai ffmpeg-python

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Generate podcast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: qwen/qwen-plus
        run: python scripts/generate_podcast.py --auto

      - name: Update RSS
        run: python scripts/update_rss.py

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
