name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1,3,5' # 周一/三/五 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {} # 支持手动触发

# 串行队列：同时间只跑一个，trigger 的新 run 排在后面等
concurrency:
  group: osp-podcast-generate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages for historical episodes
        run: |
          git fetch origin gh-pages:gh-pages || true
          # Fetch ALL mp3 (old osp-podcast-* and new episode_*)
          git checkout gh-pages -- docs/episodes/*.mp3 docs/ 2>/dev/null || true
          # Fetch both JSON formats
          git checkout gh-pages -- docs/episodes/episode_*.json docs/ 2>/dev/null || true
          git checkout gh-pages -- docs/episodes/osp-podcast-*.json docs/ 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg rsync
          pip install feedparser edge-tts openai ffmpeg-python

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Commit queue to git
        if: steps.check.outputs.has_new == 'true'
        run: |
          git add -f last_article.json
          git commit -m "chore: article queue for podcast generation" || true
          git push origin main || true

      - name: Process queue (generate podcasts)
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: deepseek-v4-flash
        run: python scripts/generate_podcast.py --auto --model deepseek-v4-flash --base-url "$LLM_BASE_URL"

      - name: Update RSS
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_rss.py

      - name: Generate index.html
        run: python scripts/generate_index.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp index.html docs/
          # 把 gh-pages 已有的 episode 合并进来（不覆盖已有的 episode mp3）
          # 排除 old osp-podcast-*.json 格式，只合并不重复的新 mp3
          if [ -d docs/episodes ] && [ "$(ls -A docs/episodes)" ]; then
            echo "Preserving existing episodes from gh-pages"
            rsync -a --ignore-existing --exclude='osp-podcast-*.json' docs/episodes/ episodes/
          fi
          rsync -a episodes/ docs/episodes/
          rsync -a --include='episode_*.json' --exclude='osp-podcast-*.json' --exclude='*' episodes/ docs/

      - name: Update main branch with generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/feed.xml
          git commit -m "chore: update index.html and feed.xml" || true
          git push origin main || true

      - name: Verify audio files before deploy
        run: |
          echo "Checking audio files in docs/episodes/"
          COUNT=$(ls docs/episodes/*.mp3 2>/dev/null | wc -l)
          echo "Found $COUNT mp3 files"
          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No audio files found — preserving existing gh-pages content"
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

      - name: Update queue & trigger next run
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_queue.py