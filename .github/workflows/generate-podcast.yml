name: Auto Generate Podcast

on:
  schedule:
    - cron: '0 1 * * 1,3,5'  # 周一/三/五 UTC 1:00 = 北京时间 9:00
  workflow_dispatch: {}     # 支持手动触发
  push:
    branches: [main]        # push 到 main 时自动触发

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        run: |
          git clone --depth=1 --single-branch https://github.com/marsdream/osp-podcast.git .
          git fetch origin main
          git checkout main
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser edge-tts openai ffmpeg-python requests

      - name: Check new articles
        id: check
        run: python scripts/check_articles.py

      - name: Generate podcast
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: qwen/qwen3-14b
        run: python scripts/generate_podcast.py --auto --base-url https://openrouter.ai/api/v1 --model qwen/qwen3-14b

      - name: Update RSS
        if: steps.check.outputs.has_new == 'true'
        run: python scripts/update_rss.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp -r episodes/*.mp3 docs/episodes/ 2>/dev/null || true
          cp episodes/*.json docs/episodes/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages  # CF Pages GitHub Integration 监控 gh-pages 作为 Production
          force_orphan: true        # gh-pages 每次只保留 docs/ 最新内容，不累积旧文件
