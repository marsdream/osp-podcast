name: CF Debug v2
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug CF API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Account: $CLOUDFLARE_ACCOUNT_ID"
          echo "Token starts with: ${CLOUDFLARE_API_TOKEN:0:4}..."

          # 1. 列出所有 deployments
          echo "=== List deployments ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/osp-podcast/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Success:', d.get('success'))
if d.get('result'):
    for r in d['result'][:5]:
        print(r.get('id'), r.get('short_id'), r.get('created_on'), r.get('deployment_configs',{}).get('production',{}).get('enabled',False))
else:
    print('Errors:', d.get('errors'))
"

          # 2. 尝试 promotion（正确的 endpoint 格式）
          echo "=== Get latest deployment ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/osp-podcast/deployments?per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
results=d.get('result',[])
if results:
    r=results[0]
    print('Latest deployment ID:', r.get('id'))
    print('Latest short_id:', r.get('short_id'))
    print('Is production:', r.get('deployment_configs',{}).get('production',{}).get('enabled',False))
    print('Environment:', list(r.get('environments',{}).keys()))
else:
    print('No result, errors:', d.get('errors'))
"
