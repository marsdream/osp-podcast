name: Auto Generate Podcast (CF)

on:
  schedule:
    - cron: '0 22 * * 1,3,5'  # 每周一三五 UTC 22:00 = 北京时间 06:00
  workflow_dispatch: {}     # 支持手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，找 last_article.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser edge-tts openai ffmpeg-python requests

      - name: Check new articles
        id: check
        run: |
          python scripts/check_articles.py

      - name: Generate podcast
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: deepseek/deepseek-chat-v3-0324:free
        run: python scripts/generate_podcast.py --auto

      - name: Update RSS (podcast.herebuy.us)
        if: steps.check.outputs.has_new == 'true'
        env:
          PODCAST_BASE_URL: https://podcast.herebuy.us/
        run: python scripts/update_rss.py

      - name: Prepare pages files
        if: steps.check.outputs.has_new == 'true'
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp episodes/*.mp3 docs/episodes/ 2>/dev/null || true
          cp episodes/*.json docs/episodes/ 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has_new == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: osp-podcast
          directory: ./docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          enableBranchDeployments: false
          enableSingleDeployments: false

      - name: Update GitHub gh-pages
        if: steps.check.outputs.has_new == 'true'
        run: |
          # 直接用 pages-action 生成的 docs 目录来更新 gh-pages
          cp -r docs/* gh-pages/ 2>/dev/null || mkdir -p gh-pages && cp -r docs/* gh-pages/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf episodes/ feed.xml 2>/dev/null || true
          cp -r docs/episodes docs/feed.xml . 2>/dev/null || true
          git add episodes/ feed.xml
          git diff --cached --quiet && echo "No changes" || git commit -m "Update: $(date -u +%Y%m%d)"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
