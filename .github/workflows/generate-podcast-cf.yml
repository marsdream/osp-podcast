name: Auto Generate Podcast (CF)

on:
  schedule:
    - cron: '0 22 * * 1,3,5'  # 每周一三五 UTC 22:00 = 北京时间 06:00
  workflow_dispatch: {}     # 支持手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，找 last_article.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser edge-tts openai ffmpeg-python requests

      - name: Check new articles
        id: check
        run: |
          python scripts/check_articles.py

      - name: Generate podcast
        if: steps.check.outputs.has_new == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: deepseek/deepseek-chat-v3-0324:free
        run: python scripts/generate_podcast.py --auto

      - name: Update RSS (podcast.herebuy.us)
        if: steps.check.outputs.has_new == 'true'
        env:
          PODCAST_BASE_URL: https://podcast.herebuy.us/
        run: python scripts/update_rss.py

      - name: Prepare pages files
        run: |
          mkdir -p docs/episodes
          cp feed.xml docs/
          cp episodes/*.mp3 docs/episodes/ 2>/dev/null || true
          cp episodes/*.json docs/episodes/ 2>/dev/null || true
          # 生成首页 index.html（每次都要更新，保持和 feed.xml 一致）
          python scripts/build_index_html.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@3.106.0 pages deploy docs --project-name=osp-podcast --skip-caching

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_new == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
