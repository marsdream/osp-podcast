name: DIAG-ONLY senseLLM
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each model with the CI secret (prints status only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          set +x
          BASE="${LLM_BASE_URL%/}"
          echo "base host: $(echo "$BASE" | sed -E 's#https?://([^/]+).*#\1#')"
          echo "base path: $(echo "$BASE" | sed -E 's#https?://[^/]+##')"
          echo
          for M in sensenova-6.8-flash sensenova-6.8-flash-lite deepseek-v4-flash glm-5.2; do
            echo "===== $M ====="
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 120 \
              -X POST "$BASE/chat/completions" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"说一句话：你好\"}],\"max_tokens\":32}")
            echo "HTTP $code"
            head -c 300 /tmp/r.json; echo
            echo
            sleep 20
          done
