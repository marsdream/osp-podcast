name: CF Debug v3
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug CF API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 1. List deployments ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/osp-podcast/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Success:', d.get('success'))
if d.get('result'):
    for r in d['result'][:3]:
        print(r.get('id'), r.get('short_id'), r.get('created_on'), list(r.get('environments',{}).keys()))
else:
    print('Errors:', d.get('errors'))
"

          echo "=== 2. Try get single deployment ==="
          DEPLOY_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/osp-podcast/deployments?per_page=3" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
import sys,json
d=json.load(sys.stdin)
ids=[r['id'] for r in d.get('result',[])]
print(ids[0] if ids else 'NONE')
")
          echo "First deployment ID: $DEPLOY_ID"

          echo "=== 3. Try PATCH to set production ==="
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/osp-podcast/deployments/$DEPLOY_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"environments":{"production":{"enabled":true}}}' | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('Success:', d.get('success'))
print('Errors:', d.get('errors'))
"
